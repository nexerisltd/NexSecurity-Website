name = "nexsecurity-stream-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# Custom domain লাগছে না — Cloudflare নিজেই একটা ফ্রি
# xxxxx.workers.dev subdomain দেয়, সেটাই ব্যবহার করা হচ্ছে।
workers_dev = true

# No kv_namespaces here on purpose anymore — rate limiting
# (src/rateLimit.ts) is an in-memory, per-isolate Map now, not Workers
# KV. The old KV version did a read+write on every single request
# (including cache hits) and burned through Cloudflare's free-tier daily
# KV write limit (1,000/day, account-wide) within hours of real class
# traffic — that's the "KV operations nearing daily cap" email. The
# STREAM_RATE_LIMIT namespace (id bbb2dc95c8fa411f8d9985e9e3d575e9) is
# safe to delete from the Cloudflare dashboard (Workers & Pages -> KV) —
# nothing references it anymore.

# STREAM_TOKEN_SECRET is deliberately NOT set here — wrangler.toml is
# committed to the repo, and this value must stay a secret. Set it with:
#   npx wrangler secret put STREAM_TOKEN_SECRET
# using the EXACT SAME value as the Next.js app's STREAM_TOKEN_SECRET
# env var (Vercel -> Project -> Settings -> Environment Variables) —
# both sides derive the same AES-256-GCM key from this one string (see
# src/streamToken.ts and ../lib/streamToken.ts).

# The app's own origin (NOT this Worker's) — where a detected
# IP-mismatch or burst-fetch (see reportSuspiciousActivity in
# src/index.ts) gets fire-and-forget POSTed to
# app/api/security/token-mismatch/route.ts. A plain [vars] entry, not a
# secret, since it's just a URL — no need for `wrangler secret put` here.
[vars]
APP_ORIGIN = "https://learn.nexsecurity.example" # <- replace with your real deployed app URL

# SECURITY_WEBHOOK_SECRET IS a secret (same reasoning as
# STREAM_TOKEN_SECRET above) — set it with:
#   npx wrangler secret put SECURITY_WEBHOOK_SECRET
# using the EXACT SAME value as the Next.js app's SECURITY_WEBHOOK_SECRET
# env var. This is what lets app/api/security/token-mismatch/route.ts
# trust that a report actually came from this Worker and not from some
# random POST to a public URL trying to get someone else auto-blocked.

