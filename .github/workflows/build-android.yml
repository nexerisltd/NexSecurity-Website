name: Build Android App

# Builds and signs the NexSecurity Android app (a Trusted Web Activity
# wrapper around https://nexsecurity.vercel.app) using Bubblewrap's
# official Docker image, so nothing needs to be installed locally — this
# runs entirely on GitHub's servers, unaffected by local power outages.
#
# REQUIRES: twa-manifest.json must already exist at the repo root. That
# file is generated ONCE via `bubblewrap init` (an interactive step — see
# android/README.md) and then committed. This workflow only ever runs
# `bubblewrap build`, which is fully non-interactive and reads that
# committed config plus the 4 signing secrets below.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    the .keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify twa-manifest.json exists
        run: |
          if [ ! -f twa-manifest.json ]; then
            echo "::error::twa-manifest.json not found at repo root. Run 'bubblewrap init' once (see android/README.md) and commit the result before running this workflow."
            exit 1
          fi

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build and sign with Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # `yes |` auto-accepts the Android SDK Build-Tools license
          # prompt ("Accept? (y/N)"), which the underlying sdkmanager
          # asks on first use and which otherwise defaults to "N" (and
          # fails the build) with no TTY attached. `-i` on docker run is
          # required for the piped input to actually reach the
          # container's stdin.
          # `--manifest` is an `init`-only flag, NOT recognized by `build`
          # (`build` operates on the twa-manifest.json already present in
          # its working directory — set via -w below). Passing it to
          # `build` anyway is what caused the "EISDIR: illegal operation
          # on a directory, read" failure on earlier runs.
          yes | docker run --rm -i \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD \
            -e BUBBLEWRAP_KEY_PASSWORD \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build \
            --skipPwaValidation \
            --signingKeyPath=/workspace/android.keystore \
            --signingKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: Remove keystore from disk
        if: always()
        run: rm -f android.keystore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: nexsecurity-android-${{ github.run_number }}
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: warn

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          gh release create "$TAG" \
            app-release-signed.apk \
            app-release-bundle.aab \
            --title "Android build #${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}."

      # Rewrites the README's download link to point at THIS run's
      # release, so the README always links to the latest build without
      # anyone touching it by hand. Only the text between the two marker
      # comments in README.md is replaced — everything else is untouched.
      # Done in a completely FRESH clone under /tmp, not in ./ (the
      # checked-out /workspace) — the Bubblewrap Docker container ran as
      # root and left some Gradle build output under app/build/ owned by
      # root, which the non-root `runner` user can't touch afterward
      # (this is what caused "Permission denied" / "cannot create
      # directory at 'app/admin'" on earlier runs). A fresh clone sidesteps
      # that poisoned working tree entirely instead of trying to clean it.
      - name: Update README download link and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-build-${{ github.run_number }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release-signed.apk"

          rm -rf /tmp/readme-clone
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/readme-clone
          cd /tmp/readme-clone

          perl -0777 -pi -e "s|(<!-- ANDROID_DOWNLOAD_LINK_START -->).*?(<!-- ANDROID_DOWNLOAD_LINK_END -->)|\$1\n\n[⬇ Download latest APK (build #${{ github.run_number }})](${URL})\n\n\$2|s" README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No README changes" || git commit -m "chore: update Android download link (build #${{ github.run_number }}) [skip ci]"
          git push
