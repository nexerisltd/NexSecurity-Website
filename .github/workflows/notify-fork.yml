name: Notify Fork on Push

on:
  push:
    branches: [main]

jobs:
  notify-mrarxme:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger mrarxme sync
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.MRARXME_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/mrarxme/NexSecurity-Website/dispatches \
            -d '{"event_type":"upstream_updated"}'

  notify-nexsecurityog:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nexsecurityog sync
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.NEXSECURITYOG_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/nexsecurityog/NexSecurity-Website/dispatches \
            -d '{"event_type":"upstream_updated"}'
